<!-- Declare the document as an HTML5 page. -->
<!DOCTYPE html>
<!-- Start the document and identify English as its language. -->
<html lang="en">
  <!-- Store metadata and linked resources. -->
  <head>
    <!-- Define UTF-8 character encoding. -->
    <meta charset="utf-8">
    <!-- Make the layout responsive on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Set the browser tab title. -->
    <title>Stargazers log</title>
    <!-- Load the page stylesheet. -->
    <link rel="stylesheet" href="style.css">
    <!-- Load the renderer after the HTML has been parsed. -->
    <script src="script.js" defer></script>
  <!-- End the document metadata section. -->
  </head>
  <!-- Start the visible page content. -->
  <body>
    <!-- Group the main content of the page. -->
    <main>
      <!-- Display the page heading. -->
      <h1>Stargazers Log</h1>
      <!-- Explain what the list contains. -->
      <p>A log of the repositories I've starred.</p>
      <!-- Provide the target list that JavaScript will populate. -->
      <ul id="repository-list" class="repository-list">
        <!-- Show temporary content while the data is loading. -->
        <li>Loading repositories...</li>
      <!-- End the repository list. -->
      </ul>
    <!-- End the main content area. -->
    </main>
  <!-- End the visible page content. -->
  </body>
<!-- End the HTML document. -->
</html>
